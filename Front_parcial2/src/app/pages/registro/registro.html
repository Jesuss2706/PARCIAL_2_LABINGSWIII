<app-plantilla-principal titulo="Crear cuenta" eyebrow="Portal del paciente" icono="bi-person-plus"
                         subtitulo="Regístrate para consultar tus citas médicas en línea." ancho="angosto">
  @if (error()) {
    <app-alerta tipo="danger" [cerrable]="true" (cerrar)="error.set(null)">{{ error() }}</app-alerta>
  }

  <div class="pa-card p-4 p-lg-5">
    <app-formulario-paciente [publico]="true" textoBoton="Crear mi cuenta" [cargando]="guardando()"
                             (guardar)="registrar($event)" (cancelar)="cancelar()" />
  </div>

  <p class="text-center small pa-muted mt-4 mb-0">
    ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
  </p>
</app-plantilla-principal>
