<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <p class="pa-fieldset-label">Datos personales</p>
  <div class="row g-3 mb-4">
    <div class="col-12 col-md-6">
      <app-campo-formulario etiqueta="Número de cédula" para="p-cedula" [obligatorio]="true"
                            [control]="form.controls.cedula" [mostrarValido]="true"
                            ayuda="También será su usuario para iniciar sesión."
                            [mensajes]="{ pattern: 'Debe tener entre 6 y 10 dígitos.', cedulaRegistrada: publico() ? 'Esta cédula ya tiene una cuenta. Inicia sesión.' : 'Ya existe un paciente con esta cédula.' }">
        <input id="p-cedula" class="form-control" inputmode="numeric" formControlName="cedula" maxlength="10">
      </app-campo-formulario>
    </div>
    <div class="col-12 col-md-6">
      <app-campo-formulario etiqueta="Fecha de nacimiento" para="p-fnac" [obligatorio]="true"
                            [control]="form.controls.fechaNacimiento">
        <input id="p-fnac" type="date" class="form-control" formControlName="fechaNacimiento" [max]="hoy">
      </app-campo-formulario>
    </div>
    <div class="col-12 col-md-6">
      <app-campo-formulario etiqueta="Nombres" para="p-nombres" [obligatorio]="true" [control]="form.controls.nombres">
        <input id="p-nombres" class="form-control" formControlName="nombres" autocomplete="off">
      </app-campo-formulario>
    </div>
    <div class="col-12 col-md-6">
      <app-campo-formulario etiqueta="Apellidos" para="p-apellidos" [obligatorio]="true" [control]="form.controls.apellidos">
        <input id="p-apellidos" class="form-control" formControlName="apellidos" autocomplete="off">
      </app-campo-formulario>
    </div>
  </div>

  <p class="pa-fieldset-label">Contacto</p>
  <div class="row g-3 mb-4">
    <div class="col-12 col-md-6">
      <app-campo-formulario etiqueta="Correo electrónico" para="p-email" [obligatorio]="true" [control]="form.controls.email">
        <input id="p-email" type="email" class="form-control" formControlName="email" placeholder="nombre@correo.com">
      </app-campo-formulario>
    </div>
    <div class="col-12 col-md-6">
      <app-campo-formulario etiqueta="Teléfono" para="p-tel" [obligatorio]="true" [control]="form.controls.telefono"
                            [mensajes]="{ pattern: 'Entre 7 y 10 dígitos.' }">
        <input id="p-tel" class="form-control" inputmode="tel" formControlName="telefono" maxlength="10">
      </app-campo-formulario>
    </div>
    <div class="col-12">
      <app-campo-formulario etiqueta="Dirección" para="p-dir" [control]="form.controls.direccion">
        <input id="p-dir" class="form-control" formControlName="direccion" placeholder="Opcional">
      </app-campo-formulario>
    </div>
  </div>

  <p class="pa-fieldset-label">Cuenta de acceso</p>
  <div class="row g-3 mb-4">
    <div class="col-12 col-md-6">
      <app-campo-formulario etiqueta="Contraseña" para="p-pass" [obligatorio]="true" [control]="form.controls.password"
                            [mensajes]="{ minlength: 'Mínimo 6 caracteres.' }">
        <input id="p-pass" class="form-control" [type]="verClave() ? 'text' : 'password'" formControlName="password" autocomplete="new-password">
      </app-campo-formulario>
    </div>
    <div class="col-12 col-md-6">
      <app-campo-formulario etiqueta="Confirmar contraseña" para="p-pass2" [obligatorio]="true" [control]="form.controls.confirmar"
                            [mensajes]="{ noCoincide: 'Las contraseñas no coinciden.' }">
        <input id="p-pass2" class="form-control" [type]="verClave() ? 'text' : 'password'" formControlName="confirmar" autocomplete="new-password">
      </app-campo-formulario>
    </div>
    <div class="col-12">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="p-ver" [checked]="verClave()" (change)="verClave.set(!verClave())">
        <label class="form-check-label small" for="p-ver">Mostrar contraseñas</label>
      </div>
    </div>
  </div>

  <div class="d-flex flex-column flex-sm-row justify-content-end gap-2">
    <app-boton variante="outline" (click)="cancelar.emit()">Cancelar</app-boton>
    <app-boton tipo="submit" [cargando]="cargando()" [deshabilitado]="form.pending" icono="bi-person-plus">
      {{ textoBoton() }}
    </app-boton>
  </div>
</form>
